name: Build & Release

# Chạy khi đẩy tag dạng v0.4.0, hoặc bấm tay ở tab Actions.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản (vd 0.4.0) — chỉ dùng khi chạy tay"
        required: false
        default: "0.0.0-test"

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ #
  windows:
    name: Windows — bộ cài .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lấy số phiên bản
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Chạy test
        run: python -m pytest tests -q

      - name: Tải ffmpeg kèm theo bộ cài
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $src = Get-ChildItem ffmpeg_tmp -Directory | Select-Object -First 1
          Copy-Item "$($src.FullName)\bin\ffmpeg.exe"  bin\ -Force
          Copy-Item "$($src.FullName)\bin\ffprobe.exe" bin\ -Force
          Copy-Item "$($src.FullName)\LICENSE"         bin\FFMPEG-LICENSE.txt -Force -ErrorAction SilentlyContinue
          Remove-Item ffmpeg.zip, ffmpeg_tmp -Recurse -Force

      - name: Đóng gói .exe
        run: pyinstaller --noconfirm --clean CapCutDraftStudio.spec

      - name: Kiểm tra .exe đã tạo
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\CapCut Draft Studio.exe")) {
            throw "Khong thay file .exe trong dist"
          }

      - name: Tạo bộ cài bằng Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer\setup.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist_installer/*.exe
          if-no-files-found: error

  # ------------------------------------------------------------------ #
  macos:
    name: macOS — gói .dmg
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lấy số phiên bản
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Chạy test
        run: python -m pytest tests -q

      - name: Tạo icon .icns từ icon.png
        run: |
          set -e
          mkdir -p build/icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/icon.png --out "build/icon.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s*2))
            sips -z $d $d assets/icon.png --out "build/icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns build/icon.iconset -o assets/icon.icns
          ls -la assets/icon.icns

      - name: Đóng gói .app
        run: pyinstaller --noconfirm --clean CapCutDraftStudio.spec

      - name: Đóng gói .dmg
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dmg_root
          cp -R "dist/CapCut Draft Studio.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          mkdir -p dist_installer
          hdiutil create -volname "CapCut Draft Studio" -srcfolder dmg_root \
            -ov -format UDZO "dist_installer/CapCutDraftStudio-${V}-macos.dmg"
          ls -la dist_installer

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist_installer/*.dmg
          if-no-files-found: error

  # ------------------------------------------------------------------ #
  release:
    name: Phát hành lên GitHub Releases
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gom file và tạo bảng băm SHA-256
        run: |
          set -e
          mkdir -p release
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" \) -exec cp {} release/ \;
          cd release
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Tool CHỈ chịu cập nhật khi file tải về khớp SHA256SUMS.txt,
      # nên file này bắt buộc phải nằm trong release.
      - name: Tạo release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
